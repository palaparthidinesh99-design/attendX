version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/attendance_system
      - JWT_SECRET=production_qa_secret_key_849204918239012
      - NODE_ENV=production
    depends_on:
      mongo:
        condition: service_healthy
    restart: always

  mongo:
    image: mongo:7-jammy
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  mongo_data:
