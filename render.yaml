services:
  # Backend API Web Service
  - type: web
    name: attendx-backend
    env: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false

  # Frontend Static Site
  - type: static_site
    name: attendx-frontend
    plan: free
    region: singapore
    rootDir: frontend
    publishDir: .
    routes:
      - type: rewrite
        source: /student
        destination: /student.html
      - type: rewrite
        source: /teacher
        destination: /teacher.html
      - type: rewrite
        source: /*
        destination: /index.html
